    <!-- Add JavaScript for popup functionality -->
    <script>
document.addEventListener("DOMContentLoaded", function () {
    const galleryImages = document.querySelectorAll(".gallery .image img");
    const popupContainer = document.querySelector(".popup-container");
    const popupImage = document.querySelector(".popup-image");
    const popupClose = document.querySelector(".popup-close");
    const popupPrev = document.querySelector(".popup-prev");
    const popupNext = document.querySelector(".popup-next");
    let currentIndex = 0;

    // Open popup
    function openPopup(index) {
        currentIndex = index;
        popupImage.src = galleryImages[index].src;
        popupContainer.style.display = "flex";
    }

    // Close popup
    function closePopup() {
        popupContainer.style.display = "none";
    }

    // Next image
    function nextImage() {
        currentIndex = (currentIndex + 1) % galleryImages.length;
        popupImage.src = galleryImages[currentIndex].src;
    }

    // Previous image
    function prevImage() {
        currentIndex = (currentIndex - 1 + galleryImages.length) % galleryImages.length;
        popupImage.src = galleryImages[currentIndex].src;
    }

    // Open popup on image click
    galleryImages.forEach((image, index) => {
        image.addEventListener("click", () => openPopup(index));
    });

    // Close popup when clicking anywhere inside popupContainer (including the image)
    popupContainer.addEventListener("click", closePopup);

    // Prevent event bubbling when clicking on navigation arrows (so they don’t trigger close)
    popupPrev.addEventListener("click", function (event) {
        event.stopPropagation();
        prevImage();
    });

    popupNext.addEventListener("click", function (event) {
        event.stopPropagation();
        nextImage();
    });

    // Close popup when clicking close button
    popupClose.addEventListener("click", function (event) {
        event.stopPropagation(); // Prevent event from reaching the container
        closePopup();
    });

    // Scroll wheel navigation
    popupContainer.addEventListener("wheel", function (event) {
        event.preventDefault();
        if (event.deltaY > 0) nextImage();
        else prevImage();
    });

    // Swipe gesture detection (for mobile)
    let startX = null;
    popupContainer.addEventListener("touchstart", function (event) {
        startX = event.touches[0].clientX;
    });

    popupContainer.addEventListener("touchmove", function (event) {
        if (!startX) return;
        let diff = startX - event.touches[0].clientX;
        if (diff > 0) nextImage();
        else prevImage();
        startX = null;
    });
});
    </script>

    <script>
// Move to Top Button functionality
const moveToTopButton = document.getElementById('moveToTop');
let lastScrollY = window.scrollY;

function handleScroll() {
    const currentScrollY = window.scrollY;
    const windowHeight = window.innerHeight;
    const documentHeight = document.documentElement.scrollHeight;

    if (window.innerWidth >= 768) {
        // Desktop: Show after scrolling 100px
        if (currentScrollY > 100) {
            moveToTopButton.classList.add('visible');
        } else {
            moveToTopButton.classList.remove('visible');
        }
    } else {
        // Mobile: Show when scrolling up past 300px OR near bottom 80%
        if (
            (currentScrollY < lastScrollY && currentScrollY > 300) ||
            (currentScrollY + windowHeight > documentHeight * 0.8)
        ) {
            moveToTopButton.classList.add('visible');
        } else {
            moveToTopButton.classList.remove('visible');
        }
    }

    // Apply special behavior only for mobile (≤600px)
    if (window.innerWidth <= 600) {
        if (currentScrollY + windowHeight >= documentHeight - 10) {
            moveToTopButton.style.bottom = "75px"; // Move up when at page end
        } else {
            moveToTopButton.style.bottom = "15px"; // Default position on mobile
        }
    } else {
        // Default position for desktops (no extra shift)
        moveToTopButton.style.bottom = "20px";
    }

    lastScrollY = currentScrollY;
}

window.addEventListener('scroll', handleScroll);

moveToTopButton.addEventListener('click', () => {
    window.scrollTo({
        top: 0,
        behavior: 'smooth',
    });
});

// Initial state check on load
handleScroll();
    </script>
